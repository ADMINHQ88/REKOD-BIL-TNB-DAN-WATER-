let dashCharts = {};
let dashYear = null;
let dashBranchFilter = 'ALL';
let dashTypeFilter = 'ALL';

function destroyDashCharts(){
  Object.values(dashCharts).forEach(c=>c && c.destroy());
  dashCharts = {};
}

function recVal(pid, type, year, month, field){
  const rec = DATA.records[`${pid}_${type}_${year}_${month}`];
  return rec ? rec[field] : null;
}
function sumFieldFor(props, type, year, month, field){
  let s=0, any=false;
  props.forEach(p=>{
    const v = recVal(p.id, type, year, month, field);
    if(v!==null && v!==undefined && !isNaN(v)){ s+=v; any=true; }
  });
  return any ? s : null;
}
function lastMonthWithDataFor(props, type, year, field){
  let idx=-1;
  MONTHS.forEach((m,i)=>{ if(sumFieldFor(props, type, year, m, field)!==null) idx=i; });
  return idx;
}
function sumUpToMonthFor(props, type, year, field, uptoIdx){
  let s=0, any=false;
  for(let i=0;i<=uptoIdx;i++){
    const v = sumFieldFor(props, type, year, MONTHS[i], field);
    if(v!==null){ s+=v; any=true; }
  }
  return any ? s : null;
}
function propTotal(prop, type, year, field, uptoIdx){
  let s=0, any=false;
  for(let i=0;i<=uptoIdx;i++){
    const v = recVal(prop.id, type, year, MONTHS[i], field);
    if(v!==null && v!==undefined && !isNaN(v)){ s+=v; any=true; }
  }
  return any ? s : null;
}

function allYearsInData(){
  return Array.from(new Set(Object.keys(DATA.records).map(k=>k.split('_')[2]))).map(Number).sort((a,b)=>a-b);
}

function getDashFilteredProps(){
  return DATA.properties.filter(p => dashBranchFilter==='ALL' || p.branch===dashBranchFilter);
}

function renderDashboard(){
  const container = document.getElementById('dashboardView');
  const years = allYearsInData();
  if(years.length===0){ container.innerHTML = `<div class="empty-note">${t('empty_note_dash')}</div>`; return; }
  if(!dashYear || !years.includes(dashYear)) dashYear = years[years.length-1];
  const prevYear = dashYear - 1;

  const allBranches = Array.from(new Set(DATA.properties.map(p=>p.branch).filter(Boolean))).sort();
  const fProps = getDashFilteredProps();
  const showElec = dashTypeFilter==='ALL' || dashTypeFilter==='elec';
  const showWater = dashTypeFilter==='ALL' || dashTypeFilter==='water';

  const lastE = lastMonthWithDataFor(fProps, 'elec', dashYear, 'cost');
  const lastW = lastMonthWithDataFor(fProps, 'water', dashYear, 'cost');
  const elecCur = lastE>=0 ? sumUpToMonthFor(fProps, 'elec', dashYear, 'cost', lastE) : null;
  const elecPrev = lastE>=0 ? sumUpToMonthFor(fProps, 'elec', prevYear, 'cost', lastE) : null;
  const waterCur = lastW>=0 ? sumUpToMonthFor(fProps, 'water', dashYear, 'cost', lastW) : null;
  const waterPrev = lastW>=0 ? sumUpToMonthFor(fProps, 'water', prevYear, 'cost', lastW) : null;
  const kwhCur = lastE>=0 ? sumUpToMonthFor(fProps, 'elec', dashYear, 'reading', lastE) : null;
  const m3Cur = lastW>=0 ? sumUpToMonthFor(fProps, 'water', dashYear, 'reading', lastW) : null;
  const ed = pctDelta(elecPrev, elecCur);
  const wd = pctDelta(waterPrev, waterCur);

  const branches = Array.from(new Set(fProps.map(p=>p.branch).filter(Boolean))).sort();

  const propsWithElecCur = fProps.map(p=>({p, total: lastE>=0 ? propTotal(p,'elec',dashYear,'cost',lastE) : null})).filter(x=>x.total!==null);
  const propsWithWaterCur = fProps.map(p=>({p, total: lastW>=0 ? propTotal(p,'water',dashYear,'cost',lastW) : null})).filter(x=>x.total!==null);
  const topElec = propsWithElecCur.sort((a,b)=>b.total-a.total).slice(0,8);
  const topWater = propsWithWaterCur.sort((a,b)=>b.total-a.total).slice(0,8);
  const maxElec = Math.max(...topElec.map(x=>x.total), 1);
  const maxWater = Math.max(...topWater.map(x=>x.total), 1);

  const cardsHtml = [
    showElec ? `<div class="dash-card"><div class="lbl">${t('card_elec_cost',{year:dashYear})}</div><div class="val">${fmtRM(elecCur)}</div><div class="delta ${deltaClass(ed)}">${deltaArrow(ed)} ${t('delta_vs',{year:prevYear, val:fmtRM(elecPrev)})}</div></div>` : '',
    showWater ? `<div class="dash-card"><div class="lbl">${t('card_water_cost',{year:dashYear})}</div><div class="val">${fmtRM(waterCur)}</div><div class="delta ${deltaClass(wd)}">${deltaArrow(wd)} ${t('delta_vs',{year:prevYear, val:fmtRM(waterPrev)})}</div></div>` : '',
    showElec ? `<div class="dash-card"><div class="lbl">${t('card_elec_kwh',{year:dashYear})}</div><div class="val">${fmtNum(kwhCur)} <small>kWh</small></div><div class="delta neu">${t('card_locations',{n:propsWithElecCur.length})}</div></div>` : '',
    showWater ? `<div class="dash-card"><div class="lbl">${t('card_water_m3',{year:dashYear})}</div><div class="val">${fmtNum(m3Cur)} <small>m³</small></div><div class="delta neu">${t('card_locations',{n:propsWithWaterCur.length})}</div></div>` : '',
  ].join('');

  const legendHtml = [
    showElec ? `<span><i class="legend-dot" style="background:var(--elec)"></i>${t('legend_year',{type:t('opt_elec_plain'), year:dashYear})}</span>` : '',
    showElec ? `<span><i class="legend-dot" style="background:var(--elec-dim);border:1px dashed var(--elec)"></i>${t('legend_year',{type:t('opt_elec_plain'), year:prevYear})}</span>` : '',
    showWater ? `<span><i class="legend-dot" style="background:var(--water)"></i>${t('legend_year',{type:t('opt_water_plain'), year:dashYear})}</span>` : '',
    showWater ? `<span><i class="legend-dot" style="background:var(--water-dim);border:1px dashed var(--water)"></i>${t('legend_year',{type:t('opt_water_plain'), year:prevYear})}</span>` : '',
  ].join('');

  const rankPanelsHtml = [
    showElec ? `<div class="dash-panel">
        <div class="dash-panel-head"><h3>${t('top_elec_title',{year:dashYear})}</h3></div>
        <div id="dashRankElec"></div>
      </div>` : '',
    showWater ? `<div class="dash-panel">
        <div class="dash-panel-head"><h3>${t('top_water_title',{year:dashYear})}</h3></div>
        <div id="dashRankWater"></div>
      </div>` : '',
  ].join('');

  container.innerHTML = `
    <div class="dash-panel-head" style="margin-bottom:14px; flex-wrap:wrap; gap:10px;">
      <h3>${t('dash_overview')}</h3>
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <div>
          <label style="font-size:11px;color:var(--muted);margin-right:6px;">${t('label_branch')}</label>
          <select class="dash-year-select" id="dashBranchSelect">
            <option value="ALL">${t('opt_all_branches')}</option>
            ${allBranches.map(b=>`<option value="${esc(b)}" ${b===dashBranchFilter?'selected':''}>${esc(b)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label style="font-size:11px;color:var(--muted);margin-right:6px;">${t('label_utility_type')}</label>
          <select class="dash-year-select" id="dashTypeSelect">
            <option value="ALL" ${dashTypeFilter==='ALL'?'selected':''}>${t('opt_all_types')}</option>
            <option value="elec" ${dashTypeFilter==='elec'?'selected':''}>${t('opt_elec')}</option>
            <option value="water" ${dashTypeFilter==='water'?'selected':''}>${t('opt_water')}</option>
          </select>
        </div>
        <div>
          <label style="font-size:11px;color:var(--muted);margin-right:6px;">${t('label_year')}</label>
          <select class="dash-year-select" id="dashYearSelect">${years.map(y=>`<option value="${y}" ${y===dashYear?'selected':''}>${y}</option>`).join('')}</select>
        </div>
      </div>
    </div>
    <div class="dash-cards">
      ${cardsHtml}
    </div>

    <div class="dash-panel">
      <div class="dash-panel-head">
        <h3>${t('trend_title')}</h3>
        <div class="dash-legend">
          ${legendHtml}
        </div>
      </div>
      <div class="dash-chart-wrap" style="height:290px;"><canvas id="dashChartTrend"></canvas></div>
    </div>

    <div class="dash-two-col">
      ${rankPanelsHtml}
    </div>

    <div class="dash-panel">
      <div class="dash-panel-head"><h3>${t('branch_breakdown_title',{year:dashYear})}</h3></div>
      <div class="dash-chart-wrap" style="height:270px;"><canvas id="dashChartBranch"></canvas></div>
    </div>
  `;

  document.getElementById('dashYearSelect').addEventListener('change', (e)=>{ dashYear = parseInt(e.target.value); renderDashboard(); });
  document.getElementById('dashBranchSelect').addEventListener('change', (e)=>{ dashBranchFilter = e.target.value; renderDashboard(); });
  document.getElementById('dashTypeSelect').addEventListener('change', (e)=>{ dashTypeFilter = e.target.value; renderDashboard(); });

  if(showElec){
    const rankElecEl = document.getElementById('dashRankElec');
    rankElecEl.innerHTML = topElec.map((x,i)=>{
      const w = (x.total/maxElec*100).toFixed(1);
      return `<div class="rank-row"><div class="rn">${i+1}</div><div class="rname" title="${esc(x.p.address)}">${esc(x.p.address)}<span class="rcompany">${esc(x.p.company||'')}</span></div><div class="rbar-wrap"><div class="rbar" style="width:${w}%;background:var(--elec)"></div></div><div class="rval">${fmtRM(x.total)}</div></div>`;
    }).join('') || `<div class="empty-note">${t('empty_note_ranking')}</div>`;
  }

  if(showWater){
    const rankWaterEl = document.getElementById('dashRankWater');
    rankWaterEl.innerHTML = topWater.map((x,i)=>{
      const w = (x.total/maxWater*100).toFixed(1);
      return `<div class="rank-row"><div class="rn">${i+1}</div><div class="rname" title="${esc(x.p.address)}">${esc(x.p.address)}<span class="rcompany">${esc(x.p.company||'')}</span></div><div class="rbar-wrap"><div class="rbar" style="width:${w}%;background:var(--water)"></div></div><div class="rval">${fmtRM(x.total)}</div></div>`;
    }).join('') || `<div class="empty-note">${t('empty_note_ranking')}</div>`;
  }

  destroyDashCharts();

  const monthlyElecCur = MONTHS.map(m=>sumFieldFor(fProps, 'elec', dashYear, m, 'cost'));
  const monthlyElecPrev = MONTHS.map(m=>sumFieldFor(fProps, 'elec', prevYear, m, 'cost'));
  const monthlyWaterCur = MONTHS.map(m=>sumFieldFor(fProps, 'water', dashYear, m, 'cost'));
  const monthlyWaterPrev = MONTHS.map(m=>sumFieldFor(fProps, 'water', prevYear, m, 'cost'));
  const monthLabels = MONTHS.map(m=>monthLabel(m).slice(0,3));

  const trendDatasets = [];
  if(showElec){
    trendDatasets.push(lineDS(t('legend_year',{type:t('opt_elec_plain'),year:dashYear}), monthlyElecCur, '#f0a93b', false));
    trendDatasets.push(lineDS(t('legend_year',{type:t('opt_elec_plain'),year:prevYear}), monthlyElecPrev, '#f0a93b', true));
  }
  if(showWater){
    trendDatasets.push(lineDS(t('legend_year',{type:t('opt_water_plain'),year:dashYear}), monthlyWaterCur, '#3fb6d3', false));
    trendDatasets.push(lineDS(t('legend_year',{type:t('opt_water_plain'),year:prevYear}), monthlyWaterPrev, '#3fb6d3', true));
  }

  dashCharts.trend = new Chart(document.getElementById('dashChartTrend'), {
    type:'line',
    data:{ labels: monthLabels, datasets: trendDatasets },
    options: dashLineOptions('RM')
  });

  const branchDatasets = [];
  if(showElec){
    const branchElec = branches.map(b=> sumOrNull(fProps.filter(p=>p.branch===b).map(p=> lastE>=0 ? propTotal(p,'elec',dashYear,'cost',lastE) : null)) );
    branchDatasets.push({ label:t('opt_elec_plain'), data: branchElec, backgroundColor:'#f0a93b', borderRadius:4, maxBarThickness:26 });
  }
  if(showWater){
    const branchWater = branches.map(b=> sumOrNull(fProps.filter(p=>p.branch===b).map(p=> lastW>=0 ? propTotal(p,'water',dashYear,'cost',lastW) : null)) );
    branchDatasets.push({ label:t('opt_water_plain'), data: branchWater, backgroundColor:'#3fb6d3', borderRadius:4, maxBarThickness:26 });
  }

  dashCharts.branch = new Chart(document.getElementById('dashChartBranch'), {
    type:'bar',
    data:{ labels: branches, datasets: branchDatasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color: chartTick(), font:{family:"'Inter',sans-serif", size:11} } },
        tooltip:{ callbacks:{ label:(ctx)=> ctx.dataset.label+': '+fmtRM(ctx.raw) } } },
      scales:{
        x:{ ticks:{ color: chartTick(), font:{size:11} }, grid:{ display:false } },
        y:{ ticks:{ color: chartTick(), font:{size:10}, callback:(v)=>'RM '+v.toLocaleString() }, grid:{ color: chartGrid() } }
      }
    }
  });
}

function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function chartTick(){ return cssVar('--chart-tick'); }
function chartGrid(){ return cssVar('--chart-grid'); }

function sumOrNull(arr){ let s=0, any=false; arr.forEach(v=>{ if(v!==null && v!==undefined && !isNaN(v)){ s+=v; any=true; } }); return any? s : null; }

function lineDS(label, data, color, dashed){
  return { label, data, borderColor: color, backgroundColor: color+'22',
    borderDash: dashed? [4,3] : [], borderWidth: dashed? 1.5 : 2.5,
    pointRadius: 2.5, pointBackgroundColor: color, tension:0.3, spanGaps:true, fill:false };
}
function dashLineOptions(unitPrefix){
  return {
    responsive:true, maintainAspectRatio:false,
    interaction:{ mode:'index', intersect:false },
    plugins:{ legend:{ display:false },
      tooltip:{ callbacks:{ label:(ctx)=> ctx.dataset.label+': '+fmtRM(ctx.raw) } } },
    scales:{
      x:{ ticks:{ color: chartTick(), font:{size:11} }, grid:{ display:false } },
      y:{ ticks:{ color: chartTick(), font:{size:10}, callback:(v)=>'RM '+v.toLocaleString() }, grid:{ color: chartGrid() } }
    }
  };
}

async function init(){
  try{
    const res = await window.storage.get('ui-lang', false);
    if(res && res.value && I18N[res.value]) LANG = res.value;
  }catch(e){}
  try{
    const res2 = await window.storage.get('ui-theme', false);
    if(res2 && (res2.value === 'dark' || res2.value === 'light')) THEME = res2.value;
  }catch(e){}
  applyTheme();
  applyStaticI18n();
  populateMonthSelect();
  await loadData();
  populateFilterTypeOptions();
  populateFilterYears();
  populateFilterMonthOptions();
  refreshRecordsView();
  document.getElementById('statusLine').textContent = t('status_line', {n: DATA.properties.length, m: Object.keys(DATA.records).length});

  document.getElementById('themeBtn').addEventListener('click', ()=>{ setTheme(THEME==='dark' ? 'light' : 'dark'); });
  document.getElementById('langBtn').addEventListener('click', ()=>{ setLang(LANG==='ms' ? 'en' : 'ms'); });
  document.getElementById('recordForm').addEventListener('submit', handleSubmit);
  document.getElementById('resetBtn').addEventListener('click', ()=>resetForm(false));
  document.getElementById('npGeocodeBtn').addEventListener('click', async ()=>{
    const addr = document.getElementById('propInput').value.trim();
    if(!addr) return;
    const btn = document.getElementById('npGeocodeBtn');
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = t('map_searching');
    try{
      const coords = await geocodeAddress(addr);
      if(coords){
        document.getElementById('npLat').value = coords.lat;
        document.getElementById('npLng').value = coords.lng;
        btn.textContent = t('map_found');
      } else {
        btn.textContent = t('map_not_found');
      }
    }catch(e){
      btn.textContent = t('map_not_found');
    }
    setTimeout(()=>{ btn.textContent = original; btn.disabled = false; }, 2000);
  });
  document.getElementById('propInput').addEventListener('input', (e)=>{
    onPropInputChange();
    renderPropSuggest(e.target.value);
  });
  document.getElementById('propInput').addEventListener('focus', (e)=>{
    if(e.target.value.trim()) renderPropSuggest(e.target.value);
  });
  document.getElementById('propSuggest').addEventListener('mousedown', (e)=>{
    const item = e.target.closest('.prop-suggest-item');
    if(!item) return;
    selectProperty(parseInt(item.getAttribute('data-id')));
  });
  document.addEventListener('click', (e)=>{
    const wrap = document.getElementById('propInput').closest('.prop-suggest-wrap');
    if(wrap && !wrap.contains(e.target)) hidePropSuggest();
  });
  document.getElementById('yearInput').addEventListener('input', updateCompareBox);
  document.getElementById('monthInput').addEventListener('change', updateCompareBox);
  document.getElementById('readingInput').addEventListener('input', updateCompareBox);
  document.getElementById('costInput').addEventListener('input', updateCompareBox);
  document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);
  document.getElementById('importBtn').addEventListener('click', triggerImport);
  document.getElementById('importFileInput').addEventListener('change', handleImportFile);
  document.getElementById('uploadBillBtn').addEventListener('click', triggerBillUpload);
  document.getElementById('billFileInput').addEventListener('change', handleBillUpload);
  const resetPagesAndRefresh = ()=>{ tablePage=1; cardsPage=1; heatmapPage=1; mapMissingPage=1; refreshRecordsView(); };
  document.getElementById('filterSearch').addEventListener('input', resetPagesAndRefresh);
  document.getElementById('filterType').addEventListener('change', resetPagesAndRefresh);
  document.getElementById('filterYear').addEventListener('change', resetPagesAndRefresh);
  document.getElementById('filterMonth').addEventListener('change', resetPagesAndRefresh);
  document.querySelectorAll('.mode-opt').forEach(b=>{
    b.addEventListener('click', ()=> setRecordsMode(b.getAttribute('data-mode')));
  });

  document.querySelectorAll('.toggle-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.toggle-opt').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      updateReadingLabel();
      updateCompareBox();
    });
  });

  document.querySelectorAll('.view-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.view-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const view = btn.getAttribute('data-view');
      document.getElementById('recordsView').style.display = view==='records' ? 'block' : 'none';
      document.getElementById('dashboardView').style.display = view==='dashboard' ? 'block' : 'none';
      if(view==='dashboard') renderDashboard();
    });
  });
}

init();

</script>
</body>
</html>
